<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Aegis Video | Peer-to-Peer Encrypted Calling</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #07090e;
      --bg-card: rgba(16, 22, 34, 0.88);
      --accent-emerald: #10b981;
      --accent-cyan: #06b6d4;
      --accent-crimson: #ef4444;
      --border-color: rgba(255, 255, 255, 0.08);
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-display: 'Outfit', var(--font-sans);
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-primary);
      color: #f1f5f9;
      font-family: var(--font-sans);
      min-height: 100vh;
      min-height: 100dvh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .video-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: max(10px, env(safe-area-inset-top, 0px)) 16px 10px 16px;
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-color);
      z-index: 50;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, rgba(6, 182, 212, 0.2), rgba(16, 185, 129, 0.2));
      border: 1px solid var(--accent-cyan);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-cyan);
    }

    .brand-title {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: -0.02em;
    }

    .video-header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    
    .back-to-chat-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 999px;
      background: rgba(99, 102, 241, 0.18);
      border: 1px solid rgba(99, 102, 241, 0.4);
      color: #a5b4fc;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      text-decoration: none;
    }
    .back-to-chat-btn:hover {
      background: rgba(99, 102, 241, 0.3);
      border-color: #818cf8;
      color: #fff;
    }
    .chat-peer-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34d399;
      font-size: 0.74rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      outline: none;
    }

    .chat-peer-btn:hover {
      background: rgba(16, 185, 129, 0.22);
      border-color: #34d399;
    }

    .status-indicator-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }

    .room-badge {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(6, 182, 212, 0.12);
      border: 1px solid rgba(6, 182, 212, 0.3);
      color: var(--accent-cyan);
    }

    /* Active Peers Modal */
    .peers-modal {
      position: fixed;
      inset: 0;
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .peers-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(3, 7, 18, 0.82);
      backdrop-filter: blur(8px);
    }

    .peers-dialog {
      position: relative;
      z-index: 1000;
      width: 100%;
      max-width: 380px;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
      animation: modalFadePop 0.2s ease-out;
    }

    @keyframes modalFadePop {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .peers-dialog-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .peers-header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .peers-header-left h4 {
      font-family: var(--font-display, inherit);
      font-size: 0.95rem;
      font-weight: 700;
      color: #f8fafc;
      margin: 0;
    }

    .popover-close-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 6px;
      line-height: 1;
    }

    .popover-close-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
    }

    .peers-list-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 280px;
      overflow-y: auto;
    }

    .peer-item-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 10px;
    }

    .peer-name-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.88rem;
      color: #f1f5f9;
    }

    .peer-badge-you {
      font-size: 0.68rem;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.18);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #34d399;
      letter-spacing: 0.05em;
    }

    /* Screen 1: Join Setup */
    .setup-screen {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-y: auto;
    }

    .setup-card {
      width: 100%;
      max-width: 420px;
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 28px 22px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      text-align: center;
    }

    .setup-card h2 {
      font-family: var(--font-display);
      font-size: 1.5rem;
      margin-bottom: 6px;
    }

    .setup-card p {
      color: #94a3b8;
      font-size: 0.85rem;
      margin-bottom: 22px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 16px;
    }

    .form-label {
      font-size: 0.82rem;
      color: #94a3b8;
      margin-bottom: 6px;
      display: block;
      font-weight: 600;
    }

    .input-field {
      width: 100%;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px 14px;
      color: #fff;
      font-size: 16px !important;
      font-family: var(--font-mono);
      outline: none;
      transition: all 0.2s ease;
    }

    .input-field:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 15px rgba(6, 182, 212, 0.25);
    }

    .join-btn {
      width: 100%;
      background: linear-gradient(135deg, var(--accent-cyan), #0891b2);
      color: #032029;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .join-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 20px rgba(6, 182, 212, 0.4);
    }

    /* Screen 2: Call Stage */
    .call-stage {
      flex: 1;
      position: relative;
      background: radial-gradient(circle at center, #0b1120 0%, #020617 100%);
      display: none;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
    }

    /* Remote Video Viewport with Ambient Lighting */
    .remote-video-wrap {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #020617;
      overflow: hidden;
    }

    /* Optimized Aspect Ratio: Default contain prevents head / side cropping */
    .remote-video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      transition: object-fit 0.25s ease, opacity 0.2s ease;
      background: #000;
    }

    /* Fill Screen Mode (User Toggled) */
    .remote-video.fill-screen {
      object-fit: cover;
    }

    .waiting-placeholder {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      color: #94a3b8;
      font-size: 0.92rem;
      text-align: center;
      padding: 24px;
      pointer-events: none;
      z-index: 20;
      background: rgba(2, 6, 23, 0.85);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
      max-width: 90vw;
    }

    .waiting-pulse {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(6, 182, 212, 0.12);
      border: 1px solid rgba(6, 182, 212, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulse-ring 2.2s infinite ease-in-out;
      color: var(--accent-cyan);
    }

    @keyframes pulse-ring {
      0%, 100% { transform: scale(1); opacity: 1; box-shadow: 0 0 0 0 rgba(6, 182, 212, 0.4); }
      50% { transform: scale(1.08); opacity: 0.7; box-shadow: 0 0 20px 6px rgba(6, 182, 212, 0.2); }
    }

    /* Local Picture-in-Picture Video */
    .local-pip-wrap {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 110px;
      height: 155px;
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid rgba(6, 182, 212, 0.4);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.75);
      background: #07090e;
      z-index: 40;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
    }

    .local-pip-wrap:hover {
      border-color: var(--accent-cyan);
      box-shadow: 0 8px 30px rgba(6, 182, 212, 0.3);
    }

    .local-pip-wrap.pip-expanded {
      width: 160px;
      height: 220px;
    }

    .local-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    /* Call Controls Floating Dock */
    .call-controls-bar {
      position: absolute;
      bottom: max(16px, env(safe-area-inset-bottom, 16px));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      background: rgba(13, 17, 26, 0.92);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      z-index: 50;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.8);
    }

    .ctrl-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.18s ease;
      outline: none;
    }

    .ctrl-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      transform: scale(1.05);
    }

    .ctrl-btn.off {
      background: rgba(239, 68, 68, 0.25);
      border-color: var(--accent-crimson);
      color: #fca5a5;
    }

    .ctrl-btn.active-mode {
      background: rgba(6, 182, 212, 0.22);
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
    }

    .ctrl-btn.end-call {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      border-color: #ef4444;
      color: #fff;
    }

    .ctrl-btn.end-call:hover {
      background: #b91c1c;
      transform: scale(1.08);
    }

    /* Toast Notification */
    .toast-box {
      position: fixed;
      top: 65px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(6, 182, 212, 0.95);
      color: #032029;
      font-weight: 700;
      font-size: 0.8rem;
      padding: 8px 18px;
      border-radius: 999px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
      z-index: 100;
      display: none;
      animation: popoverFadeIn 0.2s ease-out;
      text-align: center;
      max-width: 90vw;
    }

    @keyframes popoverFadeIn {
      from { opacity: 0; transform: translate(-50%, -6px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }
  </style>
</head>
<body>

  <!-- Video Header -->
  <header class="video-header">
    <div class="brand-wrap">
      <div class="brand-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
      </div>
      <div class="brand-title">AEGIS VIDEO</div>
    </div>
    <div class="video-header-right">
      <button type="button" id="btnBackToChat" class="back-to-chat-btn" title="Return to Encrypted Text Chat" aria-label="Return to Chat">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span>Return to Chat</span>
      </button>
      <button type="button" id="btnActivePeersVideo" class="chat-peer-btn" style="display: none;" title="View members in room" aria-label="Active Peers">
        <span class="status-indicator-dot"></span>
        <span id="videoPeerCount">1</span> in call
      </button>
      <div id="roomBadge" class="room-badge" style="display: none;">Room: <span id="roomBadgeText"></span></div>
    </div>
  </header>

  <!-- Setup Screen -->
  <main id="setupScreen" class="setup-screen">
    <div class="setup-card">
      <div class="brand-icon" style="margin: 0 auto 14px auto; width: 48px; height: 48px;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
      </div>
      <h2>Join Video Call</h2>
      <p>Direct WebRTC Peer-to-Peer &bull; Zero Server Video Storage</p>

      <form id="videoJoinForm">
        <div class="form-group">
          <label class="form-label" for="videoRoomInput">Channel / Room</label>
          <input type="text" id="videoRoomInput" class="input-field" placeholder="e.g. shadow-779" required autocomplete="off">
        </div>

        <div class="form-group">
          <label class="form-label" for="videoCodenameInput">Your Codename</label>
          <input type="text" id="videoCodenameInput" class="input-field" placeholder="e.g. Agent-X" required autocomplete="off">
        </div>

        <button type="submit" class="join-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
          Start Video Call
        </button>
      </form>
    </div>
  </main>

  <!-- Active Call Stage -->
  <main id="callStage" class="call-stage" title="Tap to enable sound">
    <!-- Remote Video View (Unmuted so voice audio is heard) -->
    <div class="remote-video-wrap">
      <video id="remoteVideo" class="remote-video" autoplay playsinline></video>
      <div id="waitingState" class="waiting-placeholder">
        <div class="waiting-pulse">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        </div>
        <span>Waiting for peer to connect...</span>
      </div>
    </div>

    <!-- Local Self-View (Picture-in-Picture, Muted to prevent echo) -->
    <div id="localPipWrap" class="local-pip-wrap" title="Tap to resize self-view">
      <video id="localVideo" class="local-video" autoplay playsinline muted></video>
    </div>

    <!-- Call Controls Bar -->
    <div class="call-controls-bar">
      <!-- Mute Mic -->
      <button type="button" id="btnToggleAudio" class="ctrl-btn" title="Mute / Unmute Mic" aria-label="Toggle Microphone">
        <svg id="iconAudioOn" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
        <svg id="iconAudioOff" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;"><line x1="1" y1="1" x2="23" y2="23"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"/><path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
      </button>

      <!-- Toggle Video Camera -->
      <button type="button" id="btnToggleVideo" class="ctrl-btn" title="Turn Camera On / Off" aria-label="Toggle Video">
        <svg id="iconVideoOn" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
        <svg id="iconVideoOff" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;"><line x1="1" y1="1" x2="23" y2="23"/><path d="M21 15.5l-5-3.5 5-3.5v7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
      </button>

      <!-- Toggle Video Framing Mode (Fit Full vs Fill Screen) -->
      <button type="button" id="btnToggleFit" class="ctrl-btn" title="Toggle Fit (Uncropped) / Fill Screen" aria-label="Toggle Framing Mode">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
      </button>

      <!-- Switch Camera (Front / Back for Phones) -->
      <button type="button" id="btnFlipCamera" class="ctrl-btn" title="Flip Camera" aria-label="Flip Camera">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0-4.42-3.58-8-8-8s-8 3.58-8 8"/><path d="M4 10l-3-3 3-3"/><path d="M4 14c0 4.42 3.58 8 8 8s8-3.58 8-8"/><path d="M20 14l3 3-3 3"/></svg>
      </button>

      <!-- Return to Text Chat Button -->
      <button type="button" id="btnReturnToChatFromCall" class="ctrl-btn" title="Return to Text Chat" aria-label="Return to Text Chat" style="border-color: rgba(99, 102, 241, 0.4); color: #a5b4fc;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </button>

      <!-- End Call Button -->
      <button type="button" id="btnEndCall" class="ctrl-btn end-call" title="End Call" aria-label="End Call">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 11.36 11.36 0 0 0 3.53.56 2 2 0 0 1 2 2v3.08a2 2 0 0 1-2 2A19.86 19.86 0 0 1 3 4a2 2 0 0 1 2-2h3.08a2 2 0 0 1 2 2 11.36 11.36 0 0 0 .56 3.53 2 2 0 0 1-.45 2.11l-1.27 1.27z"/><line x1="23" y1="1" x2="1" y2="23"/></svg>
      </button>
    </div>
  </main>

  <!-- Active Peers List Modal -->
  <div id="videoPeersModal" class="peers-modal" style="display: none;">
    <div class="peers-backdrop" id="videoPeersBackdrop"></div>
    <div class="peers-dialog">
      <div class="peers-dialog-header">
        <div class="peers-header-left">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <h4>Video Call Members</h4>
        </div>
        <button type="button" id="btnCloseVideoPeers" class="popover-close-btn" aria-label="Close">✕</button>
      </div>
      <div id="videoPeersListContainer" class="peers-list-container"></div>
    </div>
  </div>

  <div id="toastBox" class="toast-box"></div>

  <script>
    (() => {
      const setupScreen = document.getElementById('setupScreen');
      const callStage = document.getElementById('callStage');
      const videoJoinForm = document.getElementById('videoJoinForm');
      const videoRoomInput = document.getElementById('videoRoomInput');
      const videoCodenameInput = document.getElementById('videoCodenameInput');
      const roomBadge = document.getElementById('roomBadge');
      const roomBadgeText = document.getElementById('roomBadgeText');

      const btnActivePeersVideo = document.getElementById('btnActivePeersVideo');
      const videoPeerCount = document.getElementById('videoPeerCount');
      const videoPeersModal = document.getElementById('videoPeersModal');
      const videoPeersBackdrop = document.getElementById('videoPeersBackdrop');
      const btnCloseVideoPeers = document.getElementById('btnCloseVideoPeers');
      const videoPeersListContainer = document.getElementById('videoPeersListContainer');

      const localVideo = document.getElementById('localVideo');
      const localPipWrap = document.getElementById('localPipWrap');
      const remoteVideo = document.getElementById('remoteVideo');
      const waitingState = document.getElementById('waitingState');

      const btnToggleAudio = document.getElementById('btnToggleAudio');
      const iconAudioOn = document.getElementById('iconAudioOn');
      const iconAudioOff = document.getElementById('iconAudioOff');

      const btnToggleVideo = document.getElementById('btnToggleVideo');
      const iconVideoOn = document.getElementById('iconVideoOn');
      const iconVideoOff = document.getElementById('iconVideoOff');

      const btnToggleFit = document.getElementById('btnToggleFit');
      const btnFlipCamera = document.getElementById('btnFlipCamera');
      const btnEndCall = document.getElementById('btnEndCall');
      const toastBox = document.getElementById('toastBox');

      let ws = null;
      let peerConnection = null;
      let localStream = null;
      let remoteStream = null;
      let currentRoom = '';
      let codename = '';
      let isAudioMuted = false;
      let isVideoOff = false;
      let isFillScreen = false;
      let facingMode = 'user';
      let activePeers = [];

      // ICE candidate queueing to eliminate race conditions
      let pendingCandidates = [];
      let isRemoteDescSet = false;

      // Multi-STUN server list for fast, reliable traversal
      const RTC_CONFIG = {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' },
          { urls: 'stun:stun2.l.google.com:19302' },
          { urls: 'stun:stun3.l.google.com:19302' },
          { urls: 'stun:stun4.l.google.com:19302' },
          { urls: 'stun:stun.cloudflare.com:3478' }
        ],
        iceCandidatePoolSize: 10
      };

      const showToast = (msg) => {
        toastBox.textContent = msg;
        toastBox.style.display = 'block';
        setTimeout(() => { toastBox.style.display = 'none'; }, 2600);
      };

      // Read Hash params & session if linked from chat
      let secretKey = '';
      const hash = window.location.hash.substring(1);
      if (hash) {
        const p = new URLSearchParams(hash);
        if (p.get('room')) videoRoomInput.value = p.get('room');
        if (p.get('codename')) videoCodenameInput.value = p.get('codename');
        if (p.get('key')) secretKey = p.get('key');
      }
      if (!secretKey) {
        try {
          const saved = JSON.parse(sessionStorage.getItem('aegis_session') || '{}');
          if (saved.passphrase) secretKey = saved.passphrase;
          if (!videoRoomInput.value && saved.room) videoRoomInput.value = saved.room;
          if (!videoCodenameInput.value && saved.codename) videoCodenameInput.value = saved.codename;
        } catch (e) {}
      }

      if (!videoCodenameInput.value) {
        videoCodenameInput.value = 'Agent-' + Math.floor(100 + Math.random() * 900);
      }

      // Initialize Camera & Microphone with Optimized Parameters
      const startMedia = async () => {
        if (localStream) {
          localStream.getTracks().forEach(t => t.stop());
          localStream = null;
        }

        const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

        // Tier 1: Optimized High-Definition Video (Fluid 30fps) + Enhanced Audio
        try {
          const videoConstraints = isMobile
            ? { facingMode: facingMode, width: { ideal: 1280, max: 1920 }, height: { ideal: 720, max: 1080 }, frameRate: { ideal: 30, min: 20 } }
            : { width: { ideal: 1280, max: 1920 }, height: { ideal: 720, max: 1080 }, frameRate: { ideal: 30, min: 20 } };

          localStream = await navigator.mediaDevices.getUserMedia({
            audio: {
              echoCancellation: { ideal: true },
              noiseSuppression: { ideal: true },
              autoGainControl: { ideal: true }
            },
            video: videoConstraints
          });
          localVideo.srcObject = localStream;
          isVideoOff = false;
          btnToggleVideo.classList.remove('off');
          iconVideoOn.style.display = 'block';
          iconVideoOff.style.display = 'none';
          return true;
        } catch (e1) {
          console.warn('Preferred video constraints failed, trying basic video...', e1);
        }

        // Tier 2: Basic Video + Audio (relaxed constraints)
        try {
          localStream = await navigator.mediaDevices.getUserMedia({
            audio: true,
            video: true
          });
          localVideo.srcObject = localStream;
          isVideoOff = false;
          btnToggleVideo.classList.remove('off');
          iconVideoOn.style.display = 'block';
          iconVideoOff.style.display = 'none';
          return true;
        } catch (e2) {
          console.warn('Basic video failed, falling back to Audio-Only...', e2);
        }

        // Tier 3: Audio-Only Fallback (Webcam is in use, locked, or unavailable)
        try {
          localStream = await navigator.mediaDevices.getUserMedia({
            audio: true,
            video: false
          });
          localVideo.srcObject = localStream;
          isVideoOff = true;
          btnToggleVideo.classList.add('off');
          iconVideoOn.style.display = 'none';
          iconVideoOff.style.display = 'block';
          showToast('⚠️ Camera busy. Connected with Audio-Only.');
          return true;
        } catch (e3) {
          console.error('Media stream error (audio & video both failed):', e3);
          alert('Microphone/Camera access failed: ' + (e3.name || 'Error') + ' - ' + (e3.message || 'Permission denied') + '.\nPlease check permissions in your browser URL bar.');
          return false;
        }
      };

      // Completely flush and reset remote video buffer to eliminate frozen frame
      const clearRemotePeer = (reason = 'Peer disconnected') => {
        console.log('Resetting remote peer state:', reason);

        // 1. Fully flush the HTML5 video element GPU buffer
        if (remoteVideo) {
          try {
            remoteVideo.pause();
            remoteVideo.srcObject = null;
            remoteVideo.removeAttribute('src');
            remoteVideo.load(); // CRITICAL: Immediately flushes last frame from GPU
          } catch (e) {
            console.warn('Error flushing remote video buffer:', e);
          }
        }

        // 2. Stop and clear all remote tracks
        if (remoteStream) {
          try {
            remoteStream.getTracks().forEach(track => {
              track.stop();
              remoteStream.removeTrack(track);
            });
          } catch (e) {}
          remoteStream = null;
        }

        // 3. Close and destroy the RTCPeerConnection cleanly
        if (peerConnection) {
          try {
            peerConnection.ontrack = null;
            peerConnection.onicecandidate = null;
            peerConnection.oniceconnectionstatechange = null;
            peerConnection.onconnectionstatechange = null;
            peerConnection.close();
          } catch (e) {}
          peerConnection = null;
        }

        isRemoteDescSet = false;
        pendingCandidates = [];

        // 4. Show the waiting placeholder
        if (waitingState) {
          waitingState.style.display = 'flex';
        }

        if (reason) {
          showToast(reason);
        }
      };

      // Drain queued ICE candidates once remoteDescription is set
      const processPendingCandidates = async () => {
        isRemoteDescSet = true;
        while (pendingCandidates.length > 0) {
          const cand = pendingCandidates.shift();
          try {
            await peerConnection.addIceCandidate(new RTCIceCandidate(cand));
          } catch (e) {
            console.warn('addIceCandidate error:', e);
          }
        }
      };

      // Optimize WebRTC Bitrate and Framerate for Smooth Fluid Video
      const optimizeVideoSenders = () => {
        if (!peerConnection) return;
        peerConnection.getSenders().forEach(sender => {
          if (sender.track && sender.track.kind === 'video' && sender.getParameters) {
            try {
              const params = sender.getParameters();
              if (!params.encodings || params.encodings.length === 0) {
                params.encodings = [{}];
              }
              params.encodings[0].maxBitrate = 1800000; // 1.8 Mbps for crisp HD
              params.encodings[0].networkPriority = 'high';
              params.degradationPreference = 'maintain-framerate'; // Smooth 30fps without stutter
              sender.setParameters(params).catch(() => {});
            } catch (e) {}
          }
        });
      };

      // Setup WebRTC PeerConnection
      const createPeerConnection = () => {
        if (peerConnection) return;
        peerConnection = new RTCPeerConnection(RTC_CONFIG);
        isRemoteDescSet = false;
        pendingCandidates = [];

        // Prepare remote stream sink
        remoteStream = new MediaStream();
        remoteVideo.srcObject = remoteStream;

        // Add local tracks
        if (localStream) {
          localStream.getTracks().forEach(track => {
            peerConnection.addTrack(track, localStream);
          });
        }

        // Ensure transceivers exist for both audio and video
        const kinds = localStream ? localStream.getTracks().map(t => t.kind) : [];
        if (!kinds.includes('video')) {
          peerConnection.addTransceiver('video', { direction: 'recvonly' });
        }
        if (!kinds.includes('audio')) {
          peerConnection.addTransceiver('audio', { direction: 'recvonly' });
        }

        optimizeVideoSenders();

        // When remote track arrives
        peerConnection.ontrack = (event) => {
          console.log('⚡ Remote media track received:', event.track.kind);

          if (event.track) {
            if (!remoteStream.getTracks().find(t => t.id === event.track.id)) {
              remoteStream.addTrack(event.track);
            }
            // If remote peer explicitly stops this track
            event.track.onended = () => {
              console.log('Remote track ended:', event.track.kind);
              clearRemotePeer('Remote video stream ended');
            };
          } else if (event.streams && event.streams[0]) {
            event.streams[0].getTracks().forEach(t => {
              if (!remoteStream.getTracks().find(x => x.id === t.id)) {
                remoteStream.addTrack(t);
              }
            });
          }

          waitingState.style.display = 'none';

          // Play remote video & audio through device speakers
          remoteVideo.play().catch(err => {
            console.warn('Autoplay restricted:', err);
            showToast('🔊 Tap anywhere to enable sound');
          });
        };

        // ICE candidate generation
        peerConnection.onicecandidate = (event) => {
          if (event.candidate && ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({
              type: 'webrtc_signal',
              roomId: currentRoom,
              signal: { candidate: event.candidate }
            }));
          }
        };

        peerConnection.oniceconnectionstatechange = () => {
          console.log('ICE Connection state:', peerConnection.iceConnectionState);
          if (peerConnection.iceConnectionState === 'connected' || peerConnection.iceConnectionState === 'completed') {
            waitingState.style.display = 'none';
            showToast('✓ Video & Audio connected');
            optimizeVideoSenders();
          } else if (peerConnection.iceConnectionState === 'failed') {
            console.warn('ICE connection failed, clearing remote peer...');
            clearRemotePeer('Connection dropped');
          } else if (peerConnection.iceConnectionState === 'disconnected') {
            clearRemotePeer('Peer disconnected');
          }
        };

        peerConnection.onconnectionstatechange = () => {
          console.log('PC Connection state:', peerConnection.connectionState);
          if (peerConnection.connectionState === 'connected') {
            waitingState.style.display = 'none';
            optimizeVideoSenders();
          } else if (peerConnection.connectionState === 'disconnected' || peerConnection.connectionState === 'failed' || peerConnection.connectionState === 'closed') {
            clearRemotePeer('Peer disconnected');
          }
        };
      };

      // Connect Signaling WebSocket
      const connectSignaling = () => {
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        ws = new WebSocket(`${protocol}//${window.location.host}`);

        ws.onopen = () => {
          ws.send(JSON.stringify({
            type: 'join',
            roomId: currentRoom,
            peerId: codename,
            clientType: 'video'
          }));
        };

        ws.onmessage = async (evt) => {
          try {
            const msg = JSON.parse(evt.data);

            if (msg.type === 'presence') {
              // Only count and track peers who are actually in the video call
              if (msg.videoPeers && Array.isArray(msg.videoPeers)) {
                activePeers = msg.videoPeers;
              } else if (msg.peers && Array.isArray(msg.peers)) {
                activePeers = msg.peers;
              } else {
                activePeers = [codename];
              }
              updatePeerBadge();

              // When another video peer joins
              if (msg.event === 'join' && msg.peerId !== codename && (!msg.clientType || msg.clientType === 'video')) {
                showToast(`👤 ${msg.peerId} joined call`);
                if (peerConnection) {
                  clearRemotePeer(null);
                }
                createAndSendOffer();
              }

              // When a video peer leaves
              if (msg.event === 'leave' && (!msg.clientType || msg.clientType === 'video')) {
                clearRemotePeer(`👤 ${msg.peerId || 'A peer'} left the call`);
              }
            }

            if (msg.type === 'webrtc_signal' && msg.signal) {
              const signal = msg.signal;

              if (signal.offer) {
                if (!peerConnection) createPeerConnection();

                // Glare / collision protection: if we sent an offer simultaneously, roll back cleanly
                if (peerConnection.signalingState !== 'stable') {
                  console.warn('Glare collision: rolling back local offer to accept remote offer');
                  await Promise.all([
                    peerConnection.setLocalDescription({ type: 'rollback' }),
                    peerConnection.setRemoteDescription(new RTCSessionDescription(signal.offer))
                  ]);
                } else {
                  await peerConnection.setRemoteDescription(new RTCSessionDescription(signal.offer));
                }

                await processPendingCandidates();

                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);

                if (ws && ws.readyState === WebSocket.OPEN) {
                  ws.send(JSON.stringify({
                    type: 'webrtc_signal',
                    roomId: currentRoom,
                    signal: { answer: answer }
                  }));
                }
                optimizeVideoSenders();
              } else if (signal.answer) {
                if (peerConnection && peerConnection.signalingState === 'have-local-offer') {
                  await peerConnection.setRemoteDescription(new RTCSessionDescription(signal.answer));
                  await processPendingCandidates();
                  optimizeVideoSenders();
                }
              } else if (signal.candidate) {
                if (isRemoteDescSet && peerConnection && peerConnection.remoteDescription && peerConnection.remoteDescription.type) {
                  try {
                    await peerConnection.addIceCandidate(new RTCIceCandidate(signal.candidate));
                  } catch (e) {
                    console.warn('addIceCandidate error:', e);
                  }
                } else {
                  pendingCandidates.push(signal.candidate);
                }
              }
            }
          } catch (e) {
            console.error('Signaling parse error:', e);
          }
        };
      };

      const createAndSendOffer = async () => {
        if (!peerConnection) createPeerConnection();
        try {
          const offer = await peerConnection.createOffer();
          await peerConnection.setLocalDescription(offer);
          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({
              type: 'webrtc_signal',
              roomId: currentRoom,
              signal: { offer: offer }
            }));
          }
          optimizeVideoSenders();
        } catch (err) {
          console.error('Error creating offer:', err);
        }
      };

      const updatePeerBadge = () => {
        const count = activePeers.length || 1;
        videoPeerCount.textContent = count;
        btnActivePeersVideo.style.display = 'inline-flex';
      };

      // Active Peers Modal Trigger
      btnActivePeersVideo.addEventListener('click', () => {
        videoPeersListContainer.innerHTML = '';
        const list = (activePeers && activePeers.length > 0) ? activePeers : [codename];
        list.forEach(name => {
          const item = document.createElement('div');
          item.className = 'peer-item-card';
          const isYou = (name === codename);

          const wrap = document.createElement('div');
          wrap.className = 'peer-name-wrap';

          const icon = document.createElement('span');
          icon.style.fontSize = '1.1rem';
          icon.textContent = '👤';

          const nameSpan = document.createElement('span');
          nameSpan.style.fontWeight = '600';
          nameSpan.textContent = name; // Safe against DOM XSS

          wrap.appendChild(icon);
          wrap.appendChild(nameSpan);
          item.appendChild(wrap);

          const badge = document.createElement('span');
          if (isYou) {
            badge.className = 'peer-badge-you';
            badge.textContent = 'YOU';
          } else {
            badge.style.color = '#34d399';
            badge.style.fontSize = '0.72rem';
            badge.style.fontWeight = '600';
            badge.textContent = '● In Call';
          }
          item.appendChild(badge);
          videoPeersListContainer.appendChild(item);
        });
        videoPeersModal.style.display = 'flex';
      });

      const closeVideoPeersModal = () => {
        videoPeersModal.style.display = 'none';
      };
      btnCloseVideoPeers.addEventListener('click', closeVideoPeersModal);
      videoPeersBackdrop.addEventListener('click', closeVideoPeersModal);

      // Join Form Submit
      videoJoinForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        currentRoom = videoRoomInput.value.trim();
        codename = videoCodenameInput.value.trim();

        if (!currentRoom || !codename) return;

        const mediaOk = await startMedia();
        if (!mediaOk) return;

        createPeerConnection();
        connectSignaling();

        setupScreen.style.display = 'none';
        callStage.style.display = 'flex';
        roomBadgeText.textContent = currentRoom;
        roomBadge.style.display = 'block';

        showToast('📞 Video channel ready');

        // Negotiation watchdog: if 2 peers are present and no connection within 3.5s, trigger offer
        setTimeout(() => {
          if (peerConnection && activePeers.length > 1 && (!remoteStream || remoteStream.getTracks().length === 0)) {
            console.log('Watchdog: triggering offer renegotiation...');
            createAndSendOffer();
          }
        }, 3500);
      });

      // Controls: Mute Audio
      btnToggleAudio.addEventListener('click', () => {
        if (!localStream) return;
        isAudioMuted = !isAudioMuted;
        localStream.getAudioTracks().forEach(t => t.enabled = !isAudioMuted);
        btnToggleAudio.classList.toggle('off', isAudioMuted);
        iconAudioOn.style.display = isAudioMuted ? 'none' : 'block';
        iconAudioOff.style.display = isAudioMuted ? 'block' : 'none';
        showToast(isAudioMuted ? 'Microphone Muted' : 'Microphone Active');
      });

      // Controls: Toggle Video
      btnToggleVideo.addEventListener('click', async () => {
        if (!localStream) return;
        const videoTracks = localStream.getVideoTracks();
        if (videoTracks.length === 0) {
          // If started as audio-only, try acquiring video track
          try {
            const vStream = await navigator.mediaDevices.getUserMedia({ video: true });
            const vTrack = vStream.getVideoTracks()[0];
            localStream.addTrack(vTrack);
            localVideo.srcObject = localStream;
            if (peerConnection) {
              peerConnection.addTrack(vTrack, localStream);
              createAndSendOffer();
            }
            isVideoOff = false;
            btnToggleVideo.classList.remove('off');
            iconVideoOn.style.display = 'block';
            iconVideoOff.style.display = 'none';
            showToast('📹 Camera activated');
            return;
          } catch (e) {
            showToast('⚠️ Could not start camera: ' + (e.message || 'Camera busy'));
            return;
          }
        }
        isVideoOff = !isVideoOff;
        videoTracks.forEach(t => t.enabled = !isVideoOff);
        btnToggleVideo.classList.toggle('off', isVideoOff);
        iconVideoOn.style.display = isVideoOff ? 'none' : 'block';
        iconVideoOff.style.display = isVideoOff ? 'block' : 'none';
        showToast(isVideoOff ? 'Camera Off' : 'Camera On');
      });

      // Controls: Toggle Video Framing Mode (Fit Full View vs Fill Screen)
      btnToggleFit.addEventListener('click', () => {
        isFillScreen = !isFillScreen;
        remoteVideo.classList.toggle('fill-screen', isFillScreen);
        btnToggleFit.classList.toggle('active-mode', isFillScreen);
        showToast(isFillScreen ? 'Framing: Fill Screen (Cropped)' : 'Framing: Fit Screen (Full View)');
      });

      // Controls: Flip Camera (Front / Back on Mobile)
      btnFlipCamera.addEventListener('click', async () => {
        facingMode = facingMode === 'user' ? 'environment' : 'user';
        const ok = await startMedia();
        if (ok && peerConnection) {
          const videoTrack = localStream.getVideoTracks()[0];
          const sender = peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
          if (sender && videoTrack) {
            sender.replaceTrack(videoTrack);
          }
        }
        showToast('Flipped Camera');
      });

      // Tap on Picture-in-Picture to expand/minimize self-view
      localPipWrap.addEventListener('click', (e) => {
        e.stopPropagation();
        localPipWrap.classList.toggle('pip-expanded');
      });

      // Tap screen to unblock sound if browser restricted autoplay
      callStage.addEventListener('click', (e) => {
        if (e.target.closest('.call-controls-bar')) return;
        if (remoteVideo && remoteVideo.paused) {
          remoteVideo.play().then(() => {
            showToast('🔊 Audio enabled');
          }).catch(() => {});
        }
      });

      // Controls: End Call
      const endCall = () => {
        if (localStream) {
          localStream.getTracks().forEach(t => t.stop());
          localStream = null;
        }
        clearRemotePeer(null);

        if (ws) {
          try {
            ws.send(JSON.stringify({ type: 'leave', roomId: currentRoom }));
            ws.close();
          } catch (e) {}
          ws = null;
        }

        localVideo.srcObject = null;
        callStage.style.display = 'none';
        roomBadge.style.display = 'none';
        btnActivePeersVideo.style.display = 'none';
        setupScreen.style.display = 'flex';
        waitingState.style.display = 'flex';
        showToast('Call ended');
      };

      // Return to Text Chat seamlessly
      const returnToChat = () => {
        endCall();
        const r = encodeURIComponent(currentRoom || videoRoomInput.value.trim() || '');
        const c = encodeURIComponent(codename || videoCodenameInput.value.trim() || '');
        const k = encodeURIComponent(secretKey || '');
        window.location.href = '/' + (r ? `#room=${r}&codename=${c}&key=${k}` : '');
      };

      const btnBackToChat = document.getElementById('btnBackToChat');
      if (btnBackToChat) btnBackToChat.addEventListener('click', returnToChat);

      const btnReturnToChatFromCall = document.getElementById('btnReturnToChatFromCall');
      if (btnReturnToChatFromCall) btnReturnToChatFromCall.addEventListener('click', returnToChat);

      btnEndCall.addEventListener('click', endCall);
    })();
  </script>
</body>
</html>
